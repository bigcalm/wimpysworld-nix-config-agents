name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Compile script
        run: python3 -m py_compile extract_agent_config.py

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Extract upstream nix-config and validate output
        run: |
          git clone --depth=1 https://github.com/wimpysworld/nix-config.git /tmp/nix-config
          python3 extract_agent_config.py /tmp/nix-config --output /tmp/extracted --quiet
          python3 - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          errors = 0
          for path in Path("/tmp/extracted").rglob("*"):
              if not path.is_file():
                  continue
              text = path.read_text(encoding="utf-8")
              try:
                  if path.suffix == ".json":
                      json.loads(text)
                  elif path.suffix == ".toml":
                      tomllib.loads(text)
              except Exception as exc:
                  print(f"Parse error in {path}: {exc}")
                  errors += 1

          raise SystemExit(errors)
          PY
