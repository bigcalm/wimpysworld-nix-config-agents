name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Compile script
        run: python3 -m py_compile extract_agent_config.py

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Extract upstream nix-config and validate output
        run: |
          git clone --depth=1 https://github.com/wimpysworld/nix-config.git /tmp/nix-config
          python3 extract_agent_config.py /tmp/nix-config --output /tmp/extracted --quiet
          python3 - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          errors = 0
          expected_dirs = {"opencode", "claude", "codex", "pi", "zed", "paseo", "cursor"}
          found = {p.name for p in Path("/tmp/extracted").iterdir() if p.is_dir()}
          if found != expected_dirs:
              print(f"Missing platform dirs: {expected_dirs - found}")
              errors += 1

          for path in Path("/tmp/extracted").rglob("*"):
              if not path.is_file():
                  continue
              text = path.read_text(encoding="utf-8")
              try:
                  if path.suffix == ".json":
                      json.loads(text)
                  elif path.suffix == ".toml":
                      tomllib.loads(text)
              except Exception as exc:
                  print(f"Parse error in {path}: {exc}")
                  errors += 1

          settings = json.loads(Path("/tmp/extracted/opencode/settings.json").read_text())
          rules = settings.get("rules", "")
          if not rules.startswith("---") or len(rules) < 100:
              print("settings.json rules missing or truncated")
              errors += 1

          # The real tree ships 4 MCP servers; a broken merge that silently
          # drops one must fail CI.
          mcp = settings.get("mcp", {})
          if sorted(mcp) != ["context7", "exa", "linear", "slack"]:
              print(f"opencode MCP server mismatch: {sorted(mcp)}")
              errors += 1

          # Tool denies render into the permission map, keyed <server>_<tool>.
          permission = settings.get("permission", {})
          if permission.get("slack_slack_send_message") != "deny":
              print("opencode MCP tool denies missing from permission map")
              errors += 1

          # House style is appended to the opencode rules.
          if "A later reader still needs the evidence." not in rules:
              print("opencode rules missing appended house style")
              errors += 1

          # tui.json carries the keybindings and TUI settings.
          tui = json.loads(Path("/tmp/extracted/opencode/tui.json").read_text())
          if len(tui.get("keybinds", {})) < 10:
              print(f"opencode tui.json keybinds missing: {len(tui.get('keybinds', {}))}")
              errors += 1
          if "tui" in settings or "keybinds" in settings:
              print("opencode settings.json must not carry tui/keybinds")
              errors += 1

          # Codex config.toml carries the MCP servers and model settings.
          codex = tomllib.loads(Path("/tmp/extracted/codex/config.toml").read_text())
          servers = codex.get("mcp_servers", {})
          if "slack" not in servers or "client_id" not in servers["slack"].get("oauth", {}):
              print("codex config.toml missing slack oauth block")
              errors += 1
          if codex.get("approval_policy") != "never" or codex.get("model") != "gpt-5.6-sol":
              print("codex config.toml missing model settings")
              errors += 1

          # Claude ships the output style; pi carries the house style.
          if not Path("/tmp/extracted/claude/output-styles/house-style.md").exists():
              print("claude output-styles/house-style.md missing")
              errors += 1
          pi_agents = Path("/tmp/extracted/pi/AGENTS.md").read_text()
          if "A later reader still needs the evidence." not in pi_agents:
              print("pi AGENTS.md missing appended house style")
              errors += 1

          raise SystemExit(errors)
          PY

      - name: Syntax-check overlay scripts and wrappers
        run: |
          bash -n apply_local_overlay.sh
          python3 -m py_compile local/patch_settings.py
          bash -n local/opencode/bin/glab-api-safe.sh
          bash -n local/opencode/bin/gh-api-safe.sh

      - name: Exercise the overlay pipeline (idempotency)
        run: |
          # Uses the upstream nix-config clone from the previous step so the
          # rules text the patch anchors on is the real one. The wrappers
          # ship from local/opencode/bin/, reviewed copies of the Fence
          # wrappers.
          export HOME=/tmp/ovl-home
          mkdir -p "$HOME"
          ./apply_local_overlay.sh /tmp/nix-config /tmp/extracted
          ./apply_local_overlay.sh /tmp/nix-config /tmp/extracted
          python3 - <<'PY'
          import json
          from pathlib import Path

          settings = json.loads(Path("/tmp/extracted/opencode/settings.json").read_text())
          rules = settings["rules"]
          # Applied exactly once: the gitlab fence marker appears one time.
          assert rules.count("Keep GitLab mutations on named, authorised paths.") == 1, rules
          assert "For GitLab, load the `glab` skill" in rules
          assert Path("/tmp/extracted/opencode/skills/glab/SKILL.md").exists()
          # Wrappers installed to the HOME-overridden PATH dir.
          assert Path("/tmp/ovl-home/.local/bin/glab-api-safe").is_file()
          assert Path("/tmp/ovl-home/.local/bin/gh-api-safe").is_file()
          PY
